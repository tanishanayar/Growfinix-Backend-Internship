services:
  postgres:
    image: postgres:16
    container_name: growfinix-postgres
    environment:
      POSTGRES_USER: growfinix
      POSTGRES_PASSWORD: growfinix123
      POSTGRES_DB: smarthub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: growfinix-redis
    ports:
      - "6379:6379"
volumes:
  pgdata:
